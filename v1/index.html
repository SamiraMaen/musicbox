<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Music Box — Vinyl Player Experience</title>
  <meta name="description" content="Premium Interactive Vinyl Player — Search songs or paste YouTube links for a cinematic retro vinyl experience." />

  <!-- Clash Display Font -->
  <link href="https://api.fontshare.com/v2/css?f[]=clash-display@200,300,400,500,600,700&display=swap" rel="stylesheet" />

  <!-- GSAP -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>

  <!-- Three.js import map -->
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.162.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.162.0/examples/jsm/"
    }
  }
  </script>

  <link rel="stylesheet" href="style.css?v=33" />

  <!-- YouTube API callback shim — must be defined BEFORE the API script loads -->
  <script>
    window._ytCallbacks = [];
    window.onYouTubeIframeAPIReady = function () {
      window._ytReady = true;
      window._ytCallbacks.forEach(fn => fn());
      window._ytCallbacks = [];
    };
  </script>
</head>
<body>

  <!-- WebGL Shader Background & Base Texture Layers -->
  <div id="bg-base-layer" aria-hidden="true"></div>
  <canvas id="bg-shader-canvas" aria-hidden="true"></canvas>

  <!-- Loading overlay -->
  <div id="loading-overlay">
    <div class="liquid-loader-container">
      <div class="liquid-col" data-index="0">
        <div class="liquid-droplet"></div>
        <div class="liquid-bar">
          <div class="liquid-tension"></div>
          <div class="liquid-wave"></div>
          <div class="liquid-shimmer"></div>
          <div class="liquid-bubble"></div>
        </div>
        <div class="liquid-base"></div>
      </div>
      <div class="liquid-col" data-index="1">
        <div class="liquid-droplet"></div>
        <div class="liquid-bar">
          <div class="liquid-tension"></div>
          <div class="liquid-wave"></div>
          <div class="liquid-shimmer"></div>
          <div class="liquid-bubble"></div>
        </div>
        <div class="liquid-base"></div>
      </div>
      <div class="liquid-col" data-index="2">
        <div class="liquid-droplet"></div>
        <div class="liquid-bar">
          <div class="liquid-tension"></div>
          <div class="liquid-wave"></div>
          <div class="liquid-shimmer"></div>
          <div class="liquid-bubble"></div>
        </div>
        <div class="liquid-base"></div>
      </div>
      <div class="liquid-col" data-index="3">
        <div class="liquid-droplet"></div>
        <div class="liquid-bar">
          <div class="liquid-tension"></div>
          <div class="liquid-wave"></div>
          <div class="liquid-shimmer"></div>
          <div class="liquid-bubble"></div>
        </div>
        <div class="liquid-base"></div>
      </div>
      <div class="liquid-col" data-index="4">
        <div class="liquid-droplet"></div>
        <div class="liquid-bar">
          <div class="liquid-tension"></div>
          <div class="liquid-wave"></div>
          <div class="liquid-shimmer"></div>
          <div class="liquid-bubble"></div>
        </div>
        <div class="liquid-base"></div>
      </div>
      <div class="liquid-col" data-index="5">
        <div class="liquid-droplet"></div>
        <div class="liquid-bar">
          <div class="liquid-tension"></div>
          <div class="liquid-wave"></div>
          <div class="liquid-shimmer"></div>
          <div class="liquid-bubble"></div>
        </div>
        <div class="liquid-base"></div>
      </div>
      <div class="liquid-col" data-index="6">
        <div class="liquid-droplet"></div>
        <div class="liquid-bar">
          <div class="liquid-tension"></div>
          <div class="liquid-wave"></div>
          <div class="liquid-shimmer"></div>
          <div class="liquid-bubble"></div>
        </div>
        <div class="liquid-base"></div>
      </div>
    </div>
  </div>

  <script>
    (function() {
      const container = document.querySelector('.liquid-loader-container');
      if (!container) return;

      const cols = container.querySelectorAll('.liquid-col');
      const colorsHex = [
        '#a855f7', // purple
        '#3b82f6', // blue
        '#06b6d4', // cyan
        '#10b981', // green
        '#eab308', // yellow
        '#f97316', // orange
        '#ef4444'  // red
      ];

      function updateLoader() {
        const time = Date.now() * 0.001 * (Math.PI / 2);

        cols.forEach((col, index) => {
          const delay = index * 0.8;
          
          // Calculate height
          const primaryWave = Math.sin(time + delay);
          const bounceWave = Math.sin(time * 4 + delay) * 0.15;
          const ripple = Math.sin(time * 8 + delay) * 0.05;
          const combinedWave = primaryWave + bounceWave + ripple;
          const heightVal = 80 * combinedWave;
          const absHeight = Math.abs(heightVal);

          // Droplet visibility
          const isDroplet = primaryWave > 0.8;

          // Elements
          const droplet = col.querySelector('.liquid-droplet');
          const bar = col.querySelector('.liquid-bar');
          const tension = col.querySelector('.liquid-tension');
          const wave = col.querySelector('.liquid-wave');
          const shimmer = col.querySelector('.liquid-shimmer');
          const bubble = col.querySelector('.liquid-bubble');
          const base = col.querySelector('.liquid-base');

          // Update droplet style
          if (droplet) {
            if (isDroplet) {
              droplet.style.opacity = '1';
              const yOffset = Math.sin(Date.now() * 0.008 + index * 0.5) * 3;
              const scale = 0.8 + Math.sin(Date.now() * 0.006 + index * 0.3) * 0.4;
              droplet.style.transform = `translateY(${yOffset}px) scale(${scale})`;
              droplet.style.boxShadow = `0 0 15px ${colorsHex[index]}40`;
            } else {
              droplet.style.opacity = '0';
              droplet.style.transform = 'translateY(10px) scale(0.5)';
              droplet.style.boxShadow = 'none';
            }
          }

          // Update main bar height and scaling
          if (bar) {
            bar.style.height = `${absHeight}px`;
            bar.style.transform = heightVal < 0 ? 'scaleY(-1)' : 'scaleY(1)';
            bar.style.boxShadow = `0 0 20px ${colorsHex[index]}50, inset 0 0 20px rgba(255,255,255,0.1)`;

            // Tension top cap scale/translation
            if (tension) {
              const tensionY = Math.sin(Date.now() * 0.003 + index * 0.5) * 1;
              const tensionScale = 0.8 + Math.sin(Date.now() * 0.004 + index * 0.3) * 0.3;
              tension.style.transform = `translateY(${tensionY}px) scaleY(${tensionScale})`;
            }

            // Wave layer translation
            if (wave) {
              const waveY = Math.sin(Date.now() * 0.002 + index * 0.5) * 2;
              wave.style.transform = `translateY(${waveY}px)`;
            }

            // Shimmer layer translation
            if (shimmer) {
              const shimmerX = Math.sin(Date.now() * 0.0015 + index * 0.7) * 8;
              shimmer.style.transform = `translateX(${shimmerX}px)`;
            }

            // Bubble layer position / scale / opacity
            if (bubble) {
              const bubbleTop = 20 + Math.sin(Date.now() * 0.003 + index * 0.8) * 10;
              const bubbleLeft = 30 + Math.sin(Date.now() * 0.002 + index * 0.6) * 20;
              const bubbleScale = 0.5 + Math.sin(Date.now() * 0.004 + index * 0.4) * 0.5;
              const bubbleOpacity = Math.sin(Date.now() * 0.005 + index * 0.9) * 0.3 + 0.3;
              bubble.style.top = `${bubbleTop}%`;
              bubble.style.left = `${bubbleLeft}%`;
              bubble.style.transform = `scale(${bubbleScale})`;
              bubble.style.opacity = bubbleOpacity;
            }
          }

          // Base droplet pulse and glow
          if (base) {
            const baseScale = 0.6 + Math.sin(Date.now() * 0.002 + index * 0.6) * 0.4;
            const baseY = Math.sin(Date.now() * 0.004 + index * 0.8) * 1;
            base.style.transform = `scale(${baseScale}) translateY(${baseY}px)`;
            base.style.opacity = Math.sin(Date.now() * 0.003 + index * 0.9) * 0.4 + 0.6;
            base.style.boxShadow = `0 2px 8px ${colorsHex[index]}40`;
          }
        });

        requestAnimationFrame(updateLoader);
      }

      updateLoader();
    })();
  </script>

  <!-- ───────────────────────── UI OVERLAY ───────────────────────── -->
  <div class="ui-overlay">

    <!-- NAV -->
    <nav class="nav" role="navigation" aria-label="Main navigation">
      <div class="logo">
        <div class="logo-mark">♪</div>
        <span class="logo-text">Music Box</span>
      </div>
      <div class="nav-search-wrap">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
        <input type="text" id="nav-search" placeholder="Search" aria-label="Quick search" autocomplete="off" />
      </div>
    </nav>

    <!-- MAIN GRID -->
    <main class="main-grid" id="main-grid">

      <!-- LEFT PANEL -->
      <section class="left-panel">

        <div class="hero">
          <h1 class="hero-title">Interactive<br>Vinyl<br>Experience</h1>
          <p class="hero-sub">Drop the needle on your favourite tracks</p>
          <div class="noise-btn-wrap">
            <button class="noise-btn" id="btn-add-vinyl">
              Add Vinyl &rarr;
            </button>
          </div>
        </div>

        <!-- SEARCH MOVED TO RIGHT PANEL -->

        <!-- NOW PLAYING CARD -->
        <div class="np-card" id="np-card" aria-live="polite">
          <div class="np-eyebrow">NOW PLAYING</div>
          <div class="np-info">
            <div class="np-title" id="np-title">—</div>
            <div class="np-artist" id="np-artist">—</div>
          </div>
          <div class="np-controls">
            <button class="ctrl-btn" id="btn-toggle" aria-label="Play or Pause">
              <svg id="ico-play" width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
              <svg id="ico-pause" width="18" height="18" viewBox="0 0 24 24" fill="currentColor" style="display:none"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
            </button>
          </div>
          <div class="np-prog-wrap">
            <div class="np-prog-track"><div class="np-prog-fill" id="np-prog-fill"></div></div>
            <div class="np-times">
              <span id="t-cur">0:00</span>
              <span id="t-tot">0:00</span>
            </div>
          </div>
        </div>

        <!-- HISTORY / VINYL STACK -->
        <section class="history-section" id="history-section">
          <div class="history-hdr">
            <h2 class="history-title">Vinyl Stack</h2>
            <span class="history-badge" id="history-badge">0 records</span>
          </div>
          <div class="history-row" id="history-row">
            <p class="history-empty" id="history-empty">Play a song to start your collection</p>
          </div>
        </section>

      </section>

      <!-- RIGHT PANEL -->
      <section class="right-panel">
        
        <!-- Standalone turntable -->
        <div id="turntable-container" aria-label="Turntable">
          <div id="yt-wrap" aria-hidden="true"><div id="youtube-player"></div></div>
          <canvas id="scene-canvas"></canvas>
          <div class="turntable-chip" id="turntable-chip">
            <span class="chip-dot" id="chip-dot"></span>
            <span id="chip-msg">Ready to play</span>
          </div>
        </div>

        <!-- SEARCH -->
        <div class="search-module" id="search-module">
          <div class="search-box" id="search-box">
            <svg class="s-icon" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
            <input
              type="text"
              id="search-input"
              placeholder="Search songs or paste YouTube link…"
              autocomplete="off"
              spellcheck="false"
              aria-label="Search for songs or paste a YouTube URL"
              aria-autocomplete="list"
              aria-controls="search-dropdown"
              role="combobox"
              aria-expanded="false"
            />
            <div class="s-spinner" id="s-spinner" aria-hidden="true"><div class="spin-ring"></div></div>
          </div>
          <div class="search-dropdown" id="search-dropdown" role="listbox" aria-label="Search results"></div>
        </div>

      </section>

    </main>

  </div><!-- /ui-overlay -->

  <!-- Flying vinyl (CSS element for transition animations) -->
  <div class="flying-vinyl" id="flying-vinyl" aria-hidden="true">
    <div class="fly-disc" id="fly-disc">
      <div class="fly-label"><img id="fly-art" alt="" /></div>
      <div class="fly-hole"></div>
    </div>
  </div>

  <!-- YouTube IFrame API -->
  <script src="https://www.youtube.com/iframe_api"></script>

  <!-- Main app (ES module) -->
  <script type="module" src="app.js?v=98"></script>

</body>
</html>
